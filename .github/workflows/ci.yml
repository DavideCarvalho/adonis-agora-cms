name: CI

on:
  push:
    branches: [master]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: lint · typecheck · test (sqlite)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm lint
      - run: pnpm --filter @adonis-agora/cms typecheck
      - run: pnpm --filter @adonis-agora/cms test
      - run: pnpm --filter @adonis-agora/cms-react typecheck
      - run: pnpm --filter @adonis-agora/cms-react test
      - run: pnpm --filter @adonis-agora/cms-admin build

  integration:
    name: integration · ${{ matrix.engine }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - engine: pg
            image: postgres:16
            env: CMS_TEST_PG_URL=postgres://cms:cms@localhost:5432/cms
          - engine: mysql
            image: mysql:8
            env: CMS_TEST_MYSQL_URL=mysql://cms:cms@localhost:3306/cms
    services:
      database:
        image: ${{ matrix.image }}
        env:
          POSTGRES_USER: cms
          POSTGRES_PASSWORD: cms
          POSTGRES_DB: cms
          MYSQL_USER: cms
          MYSQL_PASSWORD: cms
          MYSQL_DATABASE: cms
          MYSQL_ROOT_PASSWORD: root
        ports:
          - 5432:5432
          - 3306:3306
        options: >-
          --health-cmd="pg_isready -U cms || mysqladmin ping -h 127.0.0.1 -u cms -pcms"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=10
    env: ${{ matrix.env }}
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 11.24.0
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm --filter @adonis-agora/cms exec vitest run test/db/engines.spec.ts
